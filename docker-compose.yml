name: d2helper

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: d2
      POSTGRES_PASSWORD: d2
      POSTGRES_DB: d2
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # наружу только на localhost — для локального `go run`
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U d2 -d d2"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://d2:d2@postgres:5432/d2?sslmode=disable
      HTTP_ADDR: ":8080"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # для Vite dev‑сервера (он проксирует /api на localhost:8080)
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "/app/server", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: ./frontend
      args:
        VITE_APP_NAME: ${APP_NAME:-D2Helper}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-8000}:80"

volumes:
  pgdata:
